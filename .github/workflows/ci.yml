name: CI

on:
  push:
    branches:
      - main
      - agent/remove-resource-approval-details
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check
        run: npm run check

      - name: Verify tracked runtime build
        run: git diff --exit-code -- dist
